name: Feature
description: Something new for users
labels: [feature]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Who needs it and what they cannot do today
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What it does
      description: The behavior, not the implementation
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
