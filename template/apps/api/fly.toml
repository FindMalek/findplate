# From the repo root: fly launch --no-deploy --copy-config --config apps/api/fly.toml
# then: fly deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile .
app = "acme-api"
primary_region = "fra"

[env]
  PORT = "3001"
  DEPLOY_ENV = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
