name: generate
description: Build the cli the way it is published, generate a project with it and install it.

inputs:
  modules:
    description: Comma separated modules for --modules; empty for the minimum.
    required: false
    default: ""
  dir:
    description: Where the project is generated.
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          template/pnpm-lock.yaml
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2
    - name: Install and pack the cli
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        pnpm --filter findplate run prepack
    - name: Generate the project
      shell: bash
      env:
        MODULES: ${{ inputs.modules }}
        TARGET: ${{ inputs.dir }}
      run: node packages/cli/dist/index.js create "$TARGET" --name acme -y --no-git --no-install --no-skills --modules "$MODULES"
    - name: Install the project
      shell: bash
      working-directory: ${{ inputs.dir }}
      run: pnpm install --no-frozen-lockfile
