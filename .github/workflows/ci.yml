name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo:
    name: repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - name: Template versions agree
        run: >
          npx --yes syncpack@14.3.1 lint
          --source "template/package.json"
          --source "template/apps/*/package.json"
          --source "template/packages/*/package.json"

  docs:
    name: docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter findplate-docs build
      - name: Markdown output (llms.txt, .md pages)
        run: pnpm --filter findplate-docs test

  plan:
    name: module matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/module-matrix.mjs template/findplate.json

  template:
    name: template (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      PROJECT: /tmp/generated
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/generate
        with:
          modules: ${{ matrix.modules }}
          dir: ${{ env.PROJECT }}
      - name: Lint
        working-directory: ${{ env.PROJECT }}
        run: pnpm lint
      - name: Types
        working-directory: ${{ env.PROJECT }}
        run: pnpm check-types
      - name: Tests
        working-directory: ${{ env.PROJECT }}
        run: pnpm test
      - name: Build
        if: matrix.build
        working-directory: ${{ env.PROJECT }}
        run: pnpm build

  migrations:
    name: template migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT: /tmp/generated
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/generate
        with:
          dir: ${{ env.PROJECT }}
      - name: Generate a migration from the schema
        working-directory: ${{ env.PROJECT }}
        run: |
          find packages/db/drizzle -type f | sort | xargs sha256sum > "$RUNNER_TEMP/before.txt"
          pnpm db:generate
          find packages/db/drizzle -type f | sort | xargs sha256sum > "$RUNNER_TEMP/after.txt"
      - name: Fail on drift
        run: |
          if ! diff -u "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"; then
            echo "::error::schema changed without a migration, run pnpm db:generate in the template and commit the result"
            exit 1
          fi

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: /tmp/generated
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/generate
        with:
          dir: ${{ env.PROJECT }}
      - name: Build web
        working-directory: ${{ env.PROJECT }}
        run: pnpm --filter web build
      - name: Audit the landing page
        working-directory: ${{ env.PROJECT }}
        run: npx --yes @lhci/cli@0.15.1 autorun --config="$GITHUB_WORKSPACE/.github/lighthouserc.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: ${{ env.PROJECT }}/.lighthouseci
          if-no-files-found: ignore

  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile --filter findplate...
      - name: Build
        run: bun run build
        working-directory: packages/cli
      - name: Test
        run: bun test
        working-directory: packages/cli
      - name: Smoke the built cli
        run: node .github/scripts/cli-smoke.mjs

  cli-node:
    name: cli (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # node 24 is covered by the ubuntu job of `cli`, which runs the same dist
        node: ["20.19.0", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile --filter findplate...
      - name: Build
        run: bun run build
        working-directory: packages/cli
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Smoke the built cli
        run: node .github/scripts/cli-smoke.mjs
