name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo:
    name: repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - name: Template versions agree
        run: >
          npx --yes syncpack@14.3.1 lint
          --source "template/package.json"
          --source "template/apps/*/package.json"
          --source "template/packages/*/package.json"

  docs:
    name: docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter findplate-docs build
      - name: Markdown output (llms.txt, .md pages)
        run: pnpm --filter findplate-docs test

  plan:
    name: module matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/module-matrix.mjs template/findplate.json

  template:
    name: template (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      PROJECT: /tmp/generated
      DATABASE_URL: postgres://acme:acme@localhost:5432/acme
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: acme
          POSTGRES_PASSWORD: acme
          POSTGRES_DB: acme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/generate
        with:
          modules: ${{ matrix.modules }}
          dir: ${{ env.PROJECT }}
      - name: Lint
        working-directory: ${{ env.PROJECT }}
        run: pnpm lint
      - name: Types
        working-directory: ${{ env.PROJECT }}
        run: pnpm check-types
      - name: Tests
        working-directory: ${{ env.PROJECT }}
        run: pnpm test
      - name: Build
        if: matrix.build
        working-directory: ${{ env.PROJECT }}
        run: pnpm build
      - name: Playwright version
        if: matrix.name == 'all modules'
        id: playwright
        working-directory: ${{ env.PROJECT }}
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: matrix.name == 'all modules'
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install chromium
        if: matrix.name == 'all modules' && steps.browser.outputs.cache-hit != 'true'
        working-directory: ${{ env.PROJECT }}
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Install chromium system deps
        if: matrix.name == 'all modules' && steps.browser.outputs.cache-hit == 'true'
        working-directory: ${{ env.PROJECT }}
        run: pnpm --filter e2e exec playwright install-deps chromium
      - name: Smoke test
        if: matrix.name == 'all modules'
        working-directory: ${{ env.PROJECT }}
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure() && matrix.name == 'all modules'
        with:
          name: playwright-report
          path: |
            ${{ env.PROJECT }}/apps/e2e/playwright-report
            ${{ env.PROJECT }}/apps/e2e/test-results
          if-no-files-found: ignore

  migrations:
    name: template migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT: /tmp/generated
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/generate
        with:
          dir: ${{ env.PROJECT }}
      - name: Generate a migration from the schema
        working-directory: ${{ env.PROJECT }}
        run: |
          find packages/db/drizzle -type f | sort | xargs sha256sum > "$RUNNER_TEMP/before.txt"
          pnpm db:generate
          find packages/db/drizzle -type f | sort | xargs sha256sum > "$RUNNER_TEMP/after.txt"
      - name: Fail on drift
        run: |
          if ! diff -u "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt"; then
            echo "::error::schema changed without a migration, run pnpm db:generate in the template and commit the result"
            exit 1
          fi

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: /tmp/generated
    steps:
      - uses: actions/checkout@v7
      - name: Pick every module
        id: modules
        run: echo "modules=$(node -pe 'Object.keys(require("./template/findplate.json").modules).join(",")')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/generate
        with:
          dir: ${{ env.PROJECT }}
          modules: ${{ steps.modules.outputs.modules }}
      - name: Build web and dashboard
        working-directory: ${{ env.PROJECT }}
        run: pnpm --filter web --filter dashboard build
      - name: Start web and dashboard
        working-directory: ${{ env.PROJECT }}
        # 127.0.0.1 is not "localhost", so the landing pages stay indexable and the seo audit means something
        env:
          WEB_URL: http://127.0.0.1:3000
          DASHBOARD_URL: http://127.0.0.1:3002
          DEPLOY_ENV: production
        run: |
          pnpm --filter web start > web.log 2>&1 &
          pnpm --filter dashboard start > dashboard.log 2>&1 &
          for port in 3000 3002; do
            npx --yes wait-on@9 --timeout 60000 "http-get://127.0.0.1:$port/"
          done
      - name: Audit landing, roadmap, status and sign-in
        working-directory: ${{ env.PROJECT }}
        run: npx --yes @lhci/cli@0.15.1 autorun --config="$GITHUB_WORKSPACE/.github/lighthouserc.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: |
            ${{ env.PROJECT }}/.lighthouseci
            ${{ env.PROJECT }}/web.log
            ${{ env.PROJECT }}/dashboard.log
          if-no-files-found: ignore

  cli:
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile --filter findplate...
      - name: Build
        run: bun run build
        working-directory: packages/cli
      - name: Test
        run: bun test
        working-directory: packages/cli
      - name: Smoke the built cli
        run: node .github/scripts/cli-smoke.mjs

  cli-node:
    name: cli (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # node 24 is covered by the ubuntu job of `cli`, which runs the same dist
        node: ["20.19.0", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile --filter findplate...
      - name: Build
        run: bun run build
        working-directory: packages/cli
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Smoke the built cli
        run: node .github/scripts/cli-smoke.mjs
