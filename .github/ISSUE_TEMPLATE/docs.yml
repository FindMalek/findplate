name: docs
description: something in the docs site or readme is wrong or missing
labels: [docs]
body:
  - type: input
    id: page
    attributes:
      label: page or file
      placeholder: "docs/content/docs/..."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: what is wrong or missing
    validations:
      required: true
