version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      repo-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /template
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(template)"
    groups:
      template-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions:
        patterns: ["*"]
